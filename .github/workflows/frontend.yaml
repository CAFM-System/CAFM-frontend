name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------
  # 1️⃣ Install dependencies
  # -----------------------------
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

  # -----------------------------
  # 2️⃣ Syntax check (Vite)
  # -----------------------------
  syntax:
    name: Syntax Check (Vite)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vite syntax check
        run: npm run build -- --mode development

  # -----------------------------
  # 3️⃣ Security scans
  # -----------------------------
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          format: table
          ignore-unfixed: true
          exit-code: 1
          vuln-type: os,library
          directory: .

  # -----------------------------
  # 4️⃣ Run tests
  # -----------------------------
  test:
    name: Run Tests (Vitest)
    runs-on: ubuntu-latest
    needs: security
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  # -----------------------------
  # 5️⃣ Build production assets
  # -----------------------------
  build:
    name: Build Production
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist

  # -----------------------------
  # 6️⃣ Deploy to EC2
  # -----------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_KEY }}

      - name: Sync source files to EC2
        run: |
          rsync -avz \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'dist' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/frontend/

      - name: Build & Deploy Docker container on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/frontend

            sudo docker build \
              --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
              --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
              --build-arg VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }} \
              --no-cache \
              -t frontend:latest .

            sudo docker rm -f frontend 2>/dev/null || true

            # Bound to localhost only — EC2 host Nginx handles public HTTPS traffic
            sudo docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              frontend:latest

            sudo docker image prune -f
          EOF

      - name: Verify Deployment
        run: |
          sleep 10
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # Auto-restart Nginx if stopped
            if ! sudo systemctl is-active --quiet nginx; then
              echo "⚠️ Nginx was stopped — restarting..."
              sudo systemctl start nginx
            else
              echo "✅ Nginx is active"
            fi

            # Check container is running
            sudo docker ps | grep frontend \
              && echo "✅ Container is running" \
              || echo "❌ Container not found"

            # Check app responds on localhost
            curl -sf http://localhost:3000 > /dev/null \
              && echo "✅ App responding on localhost:3000" \
              || echo "⚠️ App health check failed"
          EOF